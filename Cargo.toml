[workspace]
resolver = "2"
members = [
    "crates/rada-core",
    "crates/rada-db",
    "crates/rada-cli",
    "crates/rada-web",
    "crates/rada-gui",
]

[workspace.package]
version = "0.10.6"
edition = "2021"
license = "MIT"
repository = "https://github.com/shevchukdp/rada_client"
authors = ["shevchukdp"]

[workspace.dependencies]
reqwest = { version = "0.12", features = ["blocking", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
regex = "1"
flate2 = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
tiny_http = "0.12"

rada-core = { path = "crates/rada-core" }
rada-db = { path = "crates/rada-db" }
rada-web = { path = "crates/rada-web" }

[profile.release]
opt-level = 2
lto = "thin"
strip = "debuginfo"
